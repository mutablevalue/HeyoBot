token: MTM3OTkzNzIyNDI1NDI5NjE2NA.GXlWom.zaKMFAKN9qABWfGAuldzRkCgtE0EoQdrfAkhPQ
prefix: ''
logging:
  level: info

# Bot configuration
bot:
  name: 'Your Bot Name'
  avatar: 'https://example.com/avatar.png'  # URL to bot avatar
  status:
    type: 'PLAYING'  # PLAYING, WATCHING, LISTENING, STREAMING, COMPETING
    text: 'with commands'
    url: null  # Only for STREAMING type
  bio: |
    I'm a multi-purpose Discord bot with moderation, welcome messages, and more!
    
    Use /help to see my commands.

# Development guild ID for testing (optional)
developmentGuildId: '1379953422241103943'

# Queue system configuration
queue:
  maxSize: 100
  workerCount: 3
  retryDelaySeconds: 5

# Rate limiting configuration
rateLimit:
  windowMs: 60000
  limits:
    serverOwner: 0
    administrator: 0
    default: 5
  customRoles: null
  message: You're sending commands too quickly! Please wait {time} seconds.

# Moderation system configuration
moderation:
  # Owner bypass - server owner can use all commands regardless of permissions
  ownerBypass: true
  permissions:
    administrator:
      users:
        - '987654321098765432'
        - '234567890123456789'
        - '1162730217895379025'
      roles:
        - '1235002473698299956'
      commands:
        - ban
        - unban
        - kick
        - nuke
        - setupperms
        - role
        - timeout
        - mute
        - unmute
        - forcenickname
        - unforcenickname
        - purge
    moderator:
      users:
        - '345678901234567890'
      roles:
        - '456789012345678901'
      commands:
        - lockchannel
        - unlockchannel
        - timeout
        - mute
        - unmute
        - purge
  # Permission roles created by setupperms command
  permRoles:
    vc: '1380755737906647060'
    pic: '1380755738950893658'
    link: '1380755739672313866'
  # Channel to log moderation actions
  logChannel: '1380422918017650719'
  # Command cooldowns in seconds
  cooldowns:
    default: 3
    nuke: 30
    setupperms: 60
    forcenickname: 5
    unforcenickname: 5
    mute: 5
    unmute: 5
    purge: 10
  # Forced nickname configuration
  forcedNicknames:
    dataFile: forced_nicknames.json
    checkInterval: 5000  # Check every 5 seconds
    roleId: null  # Role ID for users with forced nicknames (will be created/set automatically)

# AFK system configuration
afk:
  enabled: true
  dataFile: afk_data.json
  embedColor: 0x808080
  removeOnMessage: true
  mentionResponse:
    showTimestamp: true
    showReason: true

# Link protection configuration
linkProtection:
  enabled: true
  # URL patterns to detect (regex strings)
  patterns:
    - 'https?:\/\/(www\.)?[-a-zA-Z0-9@:%._\+~#=]{1,256}\.[a-zA-Z0-9()]{1,6}\b([-a-zA-Z0-9()@:%_\+.~#?&//=]*)'
    - 'discord\.gg\/[a-zA-Z0-9]+'
    - 'discordapp\.com\/invite\/[a-zA-Z0-9]+'
  # Who is allowed to post links
  allowed:
    # Specific users who can always post links
    users:
      - '123456789012345678'
    # Roles that can post links
    roles:
      - '789012345678901234'
    # Use the link permission role from moderation system
    useLinkPermRole: true
  # Channels where link protection is disabled
  exemptChannels:
    - '1234567890123456789'
  # Log channel for deleted links
  logChannel: '1380422905191731210'
  # Delete message settings
  deleteMessage: true
  warningMessage: '❌ You do not have permission to send links in this channel.'
  ephemeralWarning: true

# Vanity detection configuration
vanity:
  enabled: false
  checkIntervalSeconds: 120
  vanityStrings:
    - YourServer
    - .gg/yourserver
  roles:
    - '789012345678901234'
    - '890123456789012345'
  logChannel: '1380422905191731210'
  caseSensitive: false
  checkUsername: true
  checkNickname: true
  checkBio: true        # Check user's bio/about section
  checkStatus: true     # Check user's custom status
  exemptRoles:
    - '901234567890123456'
  removeOnVanityLoss: true

# Anti-Nuke configuration
antiNuke:
  whitelist:
    users:
      - '123456789012345678'
    roles:
      - '876543210987654321'
  adminUsers:
    - '987654321098765432'
    - '234567890123456789'
  adminRoles:
    - '1235002473698299956'
  limits:
    commands:
      maxActions: 5
      timeWindowSeconds: 60
    bans:
      maxActions: 3
      timeWindowSeconds: 120
    kicks:
      maxActions: 5
      timeWindowSeconds: 120
    messages:
      maxMessages: 1
      timeWindowSeconds: 10
      timeoutDuration: 60s
    channelCreate:
      maxActions: 3
      timeWindowSeconds: 60
    channelDelete:
      maxActions: 2
      timeWindowSeconds: 60
    roleCreate:
      maxActions: 3
      timeWindowSeconds: 60
    roleDelete:
      maxActions: 2
      timeWindowSeconds: 60
  adminLogChannel: '1380422918017650719'
  abuseLogChannel: '1380422905191731210'

# Join to Create (J2C) Voice Channel configuration
j2c:
  defaultChannelName: ➕ Create Voice Channel
  logChannel: null
  categoryId: null
  j2cChannelId: '1380618466557558786'

# Welcome Message System configuration
welcome:
  enabled: false
  channel: null  # Channel ID for welcome messages
  message:
    title: 'Welcome!'
    description: 'Welcome {user} to **{server}**!\n\nYou are member #{memberCount}'
    color: 0x00ff00
    thumbnail: true
    footer: 'Enjoy your stay!'
    timestamp: true

  dmEnabled: false

  dmMessage:
    title: 'Welcome to {server}!'
    description: 'Welcome {user}! Were glad to have you here.'
    color: 0x00ff00
    footer: 'Have a great time!'
    timestamp: true

  roleOnJoin: null  # Role ID to give on join
  pingUser: false
  deleteAfter: null  # Seconds to delete welcome message after (null = never)