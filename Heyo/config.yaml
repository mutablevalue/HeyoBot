  logChannel: null
  enableLogging: true

# Filter System Configuration
filter:
  enabled: true
  dataFile: 'filter_data.json'
  
  # Word filter settings
  wordFilter:
    enabled: true
    defaultWords:  # These cannot be removed via commands
      - 'nigger'
      - 'nigga'
      - 'faggot'
      - 'fag'
      - 'retard'
      - 'kys'
    customWords: []  # Added via commands
    exemptRoles: []
    exemptChannels: []
    action: 'delete'  # 'delete', 'warn', 'timeout'
    timeoutDuration: 300  # 5 minutes in seconds
    warningMessage: '⚠️ Your message contains prohibited words.'
    caseSensitive: false
    checkVariations: true  # Check l33t speak, spacing, etc.
  
  # Image filter settings
  imageFilter:
    enabled: false  # Disabled by default as it requires API
    nsfwThreshold: 0.7  # 0-1, higher = stricter
    exemptRoles: []
    exemptChannels: []
    nsfwChannels: []  # Allow NSFW in these channels
    action: 'delete'  # 'delete', 'spoiler', 'warn'
    warningMessage: '⚠️ Your image appears to contain NSFW content.'
    apiUrl: null  # External NSFW detection API URL
    maxFileSize: 8388608  # 8MB in bytes
  
  # Logging
  logChannel: null
  enableLogging: true
  
  # Statistics
  trackStats: true

# Ban Appeal System Configuration
banAppeal:
  enabled: true
  dataFile: 'ban_appeals.json'
  
  # Appeal settings
  appealChannel: null  # Channel to send appeals to
  dmMessage:
    enabled: true
    delay: 5000  # 5 seconds delay after ban in milliseconds
    content: 'You have been banned from **{server}**. If you believe this was a mistake, you can submit an appeal.'
    embedTitle: 'Ban Appeal'
    embedDescription: 'Click the button below to submit a ban appeal. Please be honest and provide as much detail as possible.'
    embedColor: 0xff0000
    buttonLabel: 'Submit Appeal'
    buttonEmoji: '📝'
  
  # Appeal form fields
  appealForm:
    reasonField:
      label: 'Why were you banned?'
      placeholder: 'Please explain what led to your ban'
      style: 'paragraph'
      minLength: 20
      maxLength: 500
      required: true
    explanationField:
      label: 'Why should you be unbanned?'
      placeholder: 'Explain why you deserve a second chance'
      style: 'paragraph'
      minLength: 50
      maxLength: 1000
      required: true
    changesField:
      label: 'What will you do differently?'
      placeholder: 'How will you ensure this doesn''t happen again?'
      style: 'paragraph'
      minLength: 30
      maxLength: 500
      required: true
    additionalField:
      label: 'Additional information'
      placeholder: 'Any other information you''d like to add (optional)'
      style: 'paragraph'
      minLength: 0
      maxLength: 500
      required: false
  
  # Cooldowns
  appealCooldown: 604800000  # 7 days in milliseconds
  maxAppeals: 3  # Max appeals per user
  
  # Notifications
  notifyRole: null  # Role to ping for new appeals
  
  # Auto responses
  autoResponses:
    submitted: 'Your appeal has been submitted successfully. You will be notified when a decision is made.'
    cooldown: 'You must wait {time} before submitting another appeal.'
    maxReached: 'You have reached the maximum number of appeals allowed.'
    error: 'An error occurred while submitting your appeal. Please try again later.'
  
  # Logging
  logChannel: null
  enableLogging: true