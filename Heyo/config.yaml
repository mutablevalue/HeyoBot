# Moderation system configuration
moderation:
  permissions:
    administrator:
      users:
        - '987654321098765432'
        - '234567890123456789'
        - '1162730217895379025'
      roles:
        - '1235002473698299956'
      commands:
        - ban
        - unban
        - kick
        - nuke
        - setupperms
        - role
        - timeout
        - forcenickname
        - unforcenickname
    moderator:
      users:
        - '345678901234567890'
      roles:
        - '456789012345678901'
